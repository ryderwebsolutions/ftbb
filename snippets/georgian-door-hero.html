<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Reusable Component — Animated Georgian Door Illustration</title>
<style>
  /*
    Self-drawing line-art Georgian door illustration.
    Pulled from graham-shiels-mortgages.html (FTBB) — saved here for reuse
    in a future project. Drop the .hero__visual block + this CSS into any
    dark hero section. Depends on --gold and --gold-light custom properties;
    define those (or hardcode) before use.

    Effects: draws itself in on load (stroke-dasharray/dashoffset), floats
    gently, and the door knocker gives an idle knock every few seconds.
    Respects prefers-reduced-motion.
  */
  :root { --gold: #c5892a; --gold-light: #e0ac52; --ease: cubic-bezier(0.22,1,0.36,1); }
  body { background: #1e1e1e; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .door-svg { width: min(90vw, 340px); height: auto; animation: doorfloat 7s ease-in-out infinite; }
  @keyframes doorfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .door-draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: doordraw 2.6s var(--ease) forwards; }
  @keyframes doordraw { to { stroke-dashoffset: 0; } }
  .door-knock { transform-origin: 253px 402px; animation: knock 3.4s ease-in-out 2.8s infinite; }
  @keyframes knock { 0%, 82%, 100% { transform: rotate(0deg); } 86% { transform: rotate(-14deg); } 90% { transform: rotate(0deg); } }

  @media (prefers-reduced-motion: reduce) {
    .door-svg, .door-draw, .door-knock { animation: none !important; }
    .door-draw { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<svg class="door-svg" viewBox="0 0 420 600" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Illustration of a Georgian Dublin front door">
  <!-- steps -->
  <line class="door-draw" x1="30" y1="580" x2="390" y2="580" stroke="rgba(255,255,255,0.3)" stroke-width="2" style="animation-delay:.1s"/>
  <line class="door-draw" x1="50" y1="560" x2="370" y2="560" stroke="rgba(255,255,255,0.3)" stroke-width="2" style="animation-delay:.2s"/>
  <line class="door-draw" x1="70" y1="540" x2="350" y2="540" stroke="rgba(255,255,255,0.3)" stroke-width="2" style="animation-delay:.3s"/>
  <!-- pilasters -->
  <rect class="door-draw" x="78" y="140" width="26" height="400" rx="2" stroke="rgba(255,255,255,0.35)" stroke-width="2" style="animation-delay:.35s"/>
  <rect class="door-draw" x="316" y="140" width="26" height="400" rx="2" stroke="rgba(255,255,255,0.35)" stroke-width="2" style="animation-delay:.4s"/>
  <line class="door-draw" x1="78" y1="180" x2="104" y2="180" stroke="rgba(255,255,255,0.35)" stroke-width="2" style="animation-delay:.5s"/>
  <line class="door-draw" x1="316" y1="180" x2="342" y2="180" stroke="rgba(255,255,255,0.35)" stroke-width="2" style="animation-delay:.5s"/>
  <!-- entablature + pediment -->
  <rect class="door-draw" x="68" y="112" width="284" height="26" stroke="rgba(255,255,255,0.4)" stroke-width="2" style="animation-delay:.55s"/>
  <path class="door-draw" d="M58 112 L210 44 L362 112" stroke="rgba(255,255,255,0.4)" stroke-width="2" style="animation-delay:.65s"/>
  <circle class="door-draw" cx="210" cy="88" r="5" stroke="var(--gold)" stroke-width="2" style="animation-delay:.9s"/>
  <!-- fanlight -->
  <path class="door-draw" d="M132 250 A78 78 0 0 1 288 250" stroke="var(--gold)" stroke-width="2.2" style="animation-delay:.75s"/>
  <line class="door-draw" x1="132" y1="250" x2="210" y2="250" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1s"/>
  <line class="door-draw" x1="157" y1="197" x2="210" y2="250" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.05s"/>
  <line class="door-draw" x1="210" y1="172" x2="210" y2="250" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.1s"/>
  <line class="door-draw" x1="263" y1="197" x2="210" y2="250" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.15s"/>
  <line class="door-draw" x1="288" y1="250" x2="210" y2="250" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.2s"/>
  <!-- door frame -->
  <rect class="door-draw" x="132" y="250" width="156" height="290" stroke="var(--gold)" stroke-width="2.2" style="animation-delay:1.3s"/>
  <!-- panels -->
  <rect class="door-draw" x="150" y="270" width="58" height="72" rx="3" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.5s"/>
  <rect class="door-draw" x="212" y="270" width="58" height="72" rx="3" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.55s"/>
  <rect class="door-draw" x="150" y="358" width="58" height="60" rx="3" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.6s"/>
  <rect class="door-draw" x="212" y="358" width="58" height="60" rx="3" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.65s"/>
  <rect class="door-draw" x="150" y="432" width="58" height="90" rx="3" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.7s"/>
  <rect class="door-draw" x="212" y="432" width="58" height="90" rx="3" stroke="var(--gold)" stroke-width="1.4" style="animation-delay:1.75s"/>
  <!-- knocker + handle -->
  <g class="door-knock">
    <circle class="door-draw" cx="241" cy="402" r="12" stroke="var(--gold-light)" stroke-width="2.2" style="animation-delay:2s"/>
    <line class="door-draw" x1="241" y1="390" x2="241" y2="382" stroke="var(--gold-light)" stroke-width="2.2" style="animation-delay:2.05s"/>
  </g>
  <circle class="door-draw" cx="179" cy="402" r="3.5" fill="var(--gold-light)" stroke="var(--gold-light)" stroke-width="1" style="animation-delay:2.1s"/>
</svg>

</body>
</html>
